name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TvDocs.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TvDocs-apk
          path: TvDocs.apk

      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TvDocs.apk \
            --title "TV Docs (latest build)" \
            --notes "Debug APK built from ${GITHUB_SHA::7}. Install it on your Android TV (see README)." \
            --target "$GITHUB_SHA"
